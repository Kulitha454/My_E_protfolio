<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="figmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#192a52" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd875" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#figmaBg)" rx="12" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Figma Toolbar Header -->
  <rect width="800" height="46" fill="#080e1c" rx="12"/>
  <rect y="36" width="800" height="10" fill="#080e1c"/>
  
  <!-- Figma Color Icon -->
  <g transform="translate(24, 13)">
    <circle cx="5" cy="5" r="4" fill="#F24E1E"/>
    <circle cx="15" cy="5" r="4" fill="#FF7262"/>
    <circle cx="5" cy="15" r="4" fill="#A259FF"/>
    <circle cx="15" cy="15" r="4" fill="#1ABCFE"/>
  </g>
  <text x="56" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Figma Prototype Workspace</text>
  <text x="760" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#d4af37" text-anchor="end">FMA Official Site UI/UX</text>

  <!-- Title -->
  <text x="40" y="80" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">Future Marketers Association — High-Fidelity UI Prototypes</text>
  <text x="40" y="102" font-family="sans-serif" font-size="12" fill="#94a3b8">Interactive Web Prototypes designed for Desktop &amp; Mobile with design system components</text>

  <!-- Left: Home Prototype Card -->
  <g transform="translate(40, 120)">
    <rect width="345" height="280" rx="8" fill="#122040" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect width="345" height="32" rx="8" fill="#0c162c"/>
    <rect y="24" width="345" height="8" fill="#0c162c"/>
    <text x="16" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffd875">1. FMA Home Page Prototype</text>

    <!-- Mini Wireframe -->
    <rect x="15" y="45" width="315" height="65" rx="4" fill="#1a2d58"/>
    <text x="25" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Future Marketers Association</text>
    <text x="25" y="88" font-family="sans-serif" font-size="9" fill="#94a3b8">Empowering next-gen marketing leaders with insight &amp; analytics</text>

    <!-- 3 Mini Feature Blocks -->
    <rect x="15" y="120" width="98" height="75" rx="4" fill="#0e1b38"/>
    <text x="22" y="145" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffd875">Events &amp; Summits</text>

    <rect x="123" y="120" width="98" height="75" rx="4" fill="#0e1b38"/>
    <text x="130" y="145" font-family="sans-serif" font-size="9" font-weight="700" fill="#38bdf8">Case Studies</text>

    <rect x="231" y="120" width="98" height="75" rx="4" fill="#0e1b38"/>
    <text x="238" y="145" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffd875">Impact Journal</text>

    <!-- Button link preview -->
    <rect x="15" y="215" width="315" height="40" rx="6" fill="#16274e" stroke="#d4af37" stroke-width="1"/>
    <text x="172" y="240" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffd875" text-anchor="middle">⚡ Launch Home Prototype</text>
  </g>

  <!-- Right: About Us Prototype Card -->
  <g transform="translate(415, 120)">
    <rect width="345" height="280" rx="8" fill="#122040" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect width="345" height="32" rx="8" fill="#0c162c"/>
    <rect y="24" width="345" height="8" fill="#0c162c"/>
    <text x="16" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">2. FMA About Us Prototype</text>

    <!-- Mini Wireframe -->
    <rect x="15" y="45" width="315" height="65" rx="4" fill="#1a2d58"/>
    <text x="25" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">About FMA Community</text>
    <text x="25" y="88" font-family="sans-serif" font-size="9" fill="#94a3b8">Executive committee, vision, mission, and member milestones</text>

    <!-- Team Members Grid Mini -->
    <circle cx="50" cy="145" r="18" fill="#0e1b38" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="120" cy="145" r="18" fill="#0e1b38" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="190" cy="145" r="18" fill="#0e1b38" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="260" cy="145" r="18" fill="#0e1b38" stroke="#d4af37" stroke-width="1.5"/>
    <text x="172" y="188" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Leadership, Editorial &amp; Sub-Editor Teams</text>

    <!-- Button link preview -->
    <rect x="15" y="215" width="315" height="40" rx="6" fill="#16274e" stroke="#38bdf8" stroke-width="1"/>
    <text x="172" y="240" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ Launch About Us Prototype</text>
  </g>

  <!-- Replace Hint -->
  <g transform="translate(620, 420)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#080e1b" stroke="#d4af37" stroke-width="1" />
    <text x="70" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffd875" text-anchor="middle">📷 Drop UI Mockup</text>
  </g>
</svg>
