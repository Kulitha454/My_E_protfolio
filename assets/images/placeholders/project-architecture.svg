<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="100%" stop-color="#122543" />
    </linearGradient>
    <linearGradient id="goldArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd875" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#archBg)" rx="10" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Browser Header -->
  <rect width="600" height="40" fill="#060d17" rx="10"/>
  <rect y="30" width="600" height="10" fill="#060d17"/>
  <circle cx="25" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="55" cy="20" r="5" fill="#10b981"/>
  <rect x="80" y="10" width="340" height="20" rx="10" fill="#162744"/>
  <text x="95" y="24" font-family="sans-serif" font-size="10" fill="#ffd875">sprightly-malabi-84a6f9.netlify.app</text>

  <!-- Hero Content -->
  <rect x="40" y="65" width="520" height="135" rx="8" fill="#101e36" stroke="rgba(212, 175, 55, 0.2)" stroke-width="1"/>
  <text x="70" y="105" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Architecture &amp; Engineering Firm</text>
  <text x="70" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8">Sustainable Engineering &amp; Modern Architectural Solutions</text>
  
  <!-- Blueprint Grid Graphics -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="110" height="90" fill="#08101e" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <polygon points="15,75 55,20 95,75" fill="none" stroke="url(#goldArch)" stroke-width="2"/>
    <line x1="55" y1="20" x2="55" y2="75" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- 3 Services Grid -->
  <rect x="40" y="220" width="160" height="120" rx="6" fill="#0d182b" stroke="#1c3055" stroke-width="1"/>
  <text x="55" y="250" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffd875">Civil Engineering</text>
  <text x="55" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8">Structural planning &amp; foundation design</text>

  <rect x="220" y="220" width="160" height="120" rx="6" fill="#0d182b" stroke="#1c3055" stroke-width="1"/>
  <text x="235" y="250" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffd875">Urban Planning</text>
  <text x="235" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8">Commercial &amp; residential zoning</text>

  <rect x="400" y="220" width="160" height="120" rx="6" fill="#0d182b" stroke="#1c3055" stroke-width="1"/>
  <text x="415" y="250" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffd875">Interior Architecture</text>
  <text x="415" y="275" font-family="sans-serif" font-size="10" fill="#94a3b8">Modern minimalist space layout</text>
