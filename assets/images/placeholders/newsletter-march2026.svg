<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="nlMarchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a152e" />
      <stop offset="60%" stop-color="#142854" />
      <stop offset="100%" stop-color="#080e1c" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd875" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <radialGradient id="meshMarch" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#nlMarchBg)" />
  <rect width="1200" height="630" fill="url(#meshMarch)" />

  <!-- Borders -->
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Branding Top Left -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#0c1730" stroke="#d4af37" stroke-width="1.5" />
    <text x="140" y="23" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffd875" text-anchor="middle" letter-spacing="2">FUTURE MARKETERS ASSOC.</text>
  </g>

  <!-- Edition Badge Top Right -->
  <g transform="translate(920, 90)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#d4af37" />
    <text x="100" y="23" font-family="sans-serif" font-size="13" font-weight="800" fill="#080e1e" text-anchor="middle" letter-spacing="1">MARCH 2026 EDITION</text>
  </g>

  <!-- Center Graphic & Typography -->
  <g transform="translate(80, 240)">
    <text x="0" y="0" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffd875" letter-spacing="4">SPECIAL SPOTLIGHT ISSUE</text>
    <text x="0" y="65" font-family="sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">THE IMPACT</text>
    <text x="0" y="130" font-family="sans-serif" font-size="64" font-weight="900" fill="url(#goldGradient)" letter-spacing="-1">MARKETER.</text>

    <text x="0" y="195" font-family="sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" width="600">
      Omnichannel Branding, Conversion Rate Optimization (CRO) &amp; Consumer Insights
    </text>
  </g>

  <!-- Right Side Graphic / Isometric Visual Silhouette -->
  <g transform="translate(820, 240)">
    <rect x="0" y="0" width="280" height="240" rx="16" fill="#0e1b38" stroke="url(#goldGradient)" stroke-width="2" />
    <path d="M 50,160 L 100,100 L 160,130 L 230,60" fill="none" stroke="#ffd875" stroke-width="4" stroke-linecap="round" />
    <circle cx="230" cy="60" r="8" fill="#38bdf8" />
    <text x="140" y="170" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">LinkedIn Banner Asset</text>
    <text x="140" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Designed by Kulitha Hansaja</text>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(80, 540)">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Sub-Editor: Kulitha Hansaja • Visual Design &amp; Layout</text>
  </g>

  <!-- Center Overlay Instruction -->
  <g transform="translate(480, 530)">
    <rect x="0" y="0" width="240" height="30" rx="15" fill="#091326" stroke="#d4af37" stroke-width="1"/>
    <text x="120" y="19" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffd875" text-anchor="middle">📷 Drop March Cover Screenshot</text>
  </g>
</svg>
