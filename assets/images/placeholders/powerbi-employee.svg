<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPbi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#111f3d" />
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgPbi)" rx="12" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Power BI Top Bar -->
  <rect x="0" y="0" width="800" height="50" fill="#080e1b" rx="12" />
  <rect x="0" y="38" width="800" height="12" fill="#080e1b" />
  <circle cx="30" cy="25" r="7" fill="#ef4444" />
  <circle cx="50" cy="25" r="7" fill="#f59e0b" />
  <circle cx="70" cy="25" r="7" fill="#10b981" />
  
  <rect x="100" y="14" width="140" height="22" rx="4" fill="#16274e" />
  <text x="170" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">⚡ POWER BI REPORT</text>
  <text x="750" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">DAX &amp; Power Query Cleaned</text>

  <!-- Title Banner -->
  <text x="40" y="90" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">Employee Performance Analytics Dashboard</text>
  <text x="40" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Multi-metric order fulfillment &amp; demographic distribution across 10 employees</text>

  <!-- 3 KPI Cards -->
  <g transform="translate(40, 130)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#132347" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>
    <text x="16" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Total Orders Tracked</text>
    <text x="16" y="60" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffd875">10,480</text>
    <text x="195" y="60" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="end">+18.4%</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="80" rx="8" fill="#132347" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="266" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Active Team Reps</text>
    <text x="266" y="60" font-family="sans-serif" font-size="26" font-weight="800" fill="#38bdf8">10 Reps</text>
    <text x="445" y="60" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">100% Avg</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="80" rx="8" fill="#132347" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>
    <text x="516" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Top Performer Efficiency</text>
    <text x="516" y="60" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffd875">96.8%</text>
    <text x="695" y="60" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="end">Tier 1</text>
  </g>

  <!-- Left Chart: Bar Chart for Employee Output -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="430" height="230" rx="8" fill="#0f1c3a" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Orders Delivered by Employee (Top 5)</text>

    <!-- Bar 1 -->
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Emp #04 (Lead)</text>
    <rect x="140" y="52" width="230" height="18" rx="4" fill="url(#barGold)" />
    <text x="380" y="66" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffd875">2,410</text>

    <!-- Bar 2 -->
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#94a3b8">Emp #09</text>
    <rect x="140" y="87" width="195" height="18" rx="4" fill="url(#barCyan)" />
    <text x="345" y="101" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1,980</text>

    <!-- Bar 3 -->
    <text x="20" y="135" font-family="sans-serif" font-size="12" fill="#94a3b8">Emp #02</text>
    <rect x="140" y="122" width="165" height="18" rx="4" fill="url(#barCyan)" />
    <text x="315" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1,650</text>

    <!-- Bar 4 -->
    <text x="20" y="170" font-family="sans-serif" font-size="12" fill="#94a3b8">Emp #07</text>
    <rect x="140" y="157" width="130" height="18" rx="4" fill="url(#barCyan)" />
    <text x="280" y="171" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1,340</text>

    <!-- Bar 5 -->
    <text x="20" y="205" font-family="sans-serif" font-size="12" fill="#94a3b8">Emp #01</text>
    <rect x="140" y="192" width="105" height="18" rx="4" fill="url(#barCyan)" />
    <text x="255" y="206" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1,120</text>
  </g>

  <!-- Right Chart: Donut / Demographics -->
  <g transform="translate(490, 230)">
    <rect x="0" y="0" width="270" height="230" rx="8" fill="#0f1c3a" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Order Age Group Split</text>
    
    <!-- Donut Simulation -->
    <circle cx="135" cy="120" r="55" fill="none" stroke="#d4af37" stroke-width="26" stroke-dasharray="160 300" stroke-dashoffset="0" />
    <circle cx="135" cy="120" r="55" fill="none" stroke="#38bdf8" stroke-width="26" stroke-dasharray="100 300" stroke-dashoffset="-165" />
    <circle cx="135" cy="120" r="55" fill="none" stroke="#818cf8" stroke-width="26" stroke-dasharray="70 300" stroke-dashoffset="-270" />
    <text x="135" y="125" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Age Split</text>

    <!-- Legend -->
    <rect x="25" y="195" width="10" height="10" rx="2" fill="#d4af37"/>
    <text x="40" y="204" font-family="sans-serif" font-size="10" fill="#94a3b8">25-34 (48%)</text>

    <rect x="115" y="195" width="10" height="10" rx="2" fill="#38bdf8"/>
    <text x="130" y="204" font-family="sans-serif" font-size="10" fill="#94a3b8">35-44 (32%)</text>

    <rect x="195" y="195" width="10" height="10" rx="2" fill="#818cf8"/>
    <text x="210" y="204" font-family="sans-serif" font-size="10" fill="#94a3b8">45+ (20%)</text>
  </g>

  <!-- Replace Image Hint Overlay in Corner -->
  <g transform="translate(620, 75)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#080e1b" stroke="#d4af37" stroke-width="1" />
    <text x="70" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffd875" text-anchor="middle">📷 Drop Screenshot Here</text>
  </g>
</svg>
